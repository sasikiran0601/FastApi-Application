<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedAssist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo-wrap">
                <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="64" height="64" rx="18" fill="url(#lg)" />
                    <rect x="26" y="12" width="12" height="40" rx="5" fill="white" />
                    <rect x="12" y="26" width="40" height="12" rx="5" fill="white" />
                    <defs>
                        <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64">
                            <stop stop-color="#06b6d4" />
                            <stop offset="1" stop-color="#3b82f6" />
                        </linearGradient>
                    </defs>
                </svg>
                <div>
                    <h1 class="logo-title">MedAssist <span>AI</span></h1>
                    <p class="logo-sub">Medical RAG Chatbot</p>
                </div>
            </div>
            <button class="new-chat-btn" id="newChatBtn" title="Start a new conversation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                New Chat
            </button>
        </header>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea"></div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Ask a medical question…" rows="1" maxlength="2000"></textarea>
                <button class="send-btn" id="sendBtn" disabled title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
            <p class="disclaimer">For educational purposes only. Always consult a qualified healthcare professional.</p>
        </div>

    </div>

    <script>
        // ── DOM ──
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        // ── New Conversation ──
        newChatBtn.addEventListener('click', () => {
            chatArea.innerHTML = '';
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            userInput.focus();
        });

        // ── Input handling ──
        userInput.addEventListener('input', () => {
            sendBtn.disabled = userInput.value.trim().length === 0;
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
        });

        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) send();
            }
        });

        sendBtn.addEventListener('click', send);

        // ── Send message ──
        async function send() {
            const text = userInput.value.trim();
            if (!text) return;

            // Show user bubble
            addBubble(text, 'user');

            // Reset input
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Show typing dots
            const typingEl = showTyping();

            try {
                // Call Flask /chat endpoint
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });

                const data = await res.json();
                typingEl.remove();

                if (data.answer) {
                    addBubble(data.answer, 'bot');
                } else {
                    addBubble('Something went wrong. Please try again.', 'bot');
                }
            } catch (err) {
                typingEl.remove();
                addBubble('Could not reach the server. Is Flask running?', 'bot');
            }
        }

        // ── Add chat bubble ──
        function addBubble(text, role) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'msg-user' : 'msg-bot';
            div.textContent = text;
            chatArea.appendChild(div);
            scrollBottom();
        }

        // ── Typing indicator ──
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>`;
            chatArea.appendChild(div);
            scrollBottom();
            return div;
        }

        // ── Scroll to bottom ──
        function scrollBottom() {
            requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
        }
    </script>

</body>

</html>
